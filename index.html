<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Fill Your Map</title>
  <meta name="description" content="Drag a state sticker onto the map to fill in the places you've been." />

  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Fill Your Map" />

  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <img class="brand-mark" src="./icons/icon.svg" alt="" width="38" height="38" />
      <div class="brand-text">
        <input id="name" class="traveler-name" type="text" maxlength="40"
               placeholder="Add a name…" aria-label="Map owner's name" autocomplete="off" />
        <p class="tagline">States I've visited</p>
      </div>
      <div class="header-stats">
        <div class="count"><span id="count">0</span><span class="of">/ 50</span><span id="countNote" class="note"></span></div>
        <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="50" aria-valuenow="0">
          <div id="progressBar" class="progress-bar"></div>
        </div>
      </div>
      <button id="menuBtn" class="icon-btn" type="button" aria-label="More options" aria-haspopup="true" aria-expanded="false">⋯</button>
    </div>
  </header>

  <main class="map-area" aria-label="Map of the United States">
    <svg id="svg" class="us-map" xmlns="http://www.w3.org/2000/svg" role="group"
         aria-label="Map of US states — drop a sticker on a state to fill it"></svg>
  </main>

  <button id="addBtn" class="add-fab" type="button" aria-haspopup="dialog" aria-controls="sheet">
    <span class="add-fab-plus" aria-hidden="true">＋</span>
    <span id="addLabel">Add a sticker</span>
  </button>

  <section id="sheet" class="sheet" aria-label="Sticker sheet" aria-modal="false" role="dialog">
    <button class="sheet-grip" id="sheetGrip" type="button" aria-label="Close sticker sheet"></button>
    <div class="sheet-head">
      <h2 class="sheet-title">Peel &amp; place <span id="trayLeft" class="tray-left"></span></h2>
      <input id="search" class="search" type="search" placeholder="Find a state…" aria-label="Search states" autocomplete="off" />
      <button id="sheetClose" class="icon-btn" type="button" aria-label="Close">✕</button>
    </div>
    <div class="sheet-body">
      <button id="autoFillBtn" class="auto-fill" type="button">
        <span class="auto-fill-icon" aria-hidden="true">📷</span> Add trip photos — I'll sort them onto the map
      </button>
      <input id="autoFillInput" type="file" accept="image/*" multiple hidden />
      <p class="tray-or">or place a sticker yourself</p>
      <div id="tray" class="tray" role="list"></div>
      <p id="trayEmpty" class="tray-done" hidden>🎉 Every sticker is on the map!</p>
    </div>
  </section>

  <div id="menu" class="menu" role="menu" hidden>
    <button id="authBtn" class="menu-item auth" type="button" role="menuitem" hidden>Sign in with Google</button>
    <button id="locateBtn" class="menu-item" type="button" role="menuitem">📍 Add where I am now</button>
    <button id="installBtn" class="menu-item" type="button" role="menuitem" hidden>Install app</button>
    <button id="exportBtn" class="menu-item" type="button" role="menuitem">Back up</button>
    <button id="importBtn" class="menu-item" type="button" role="menuitem">Restore</button>
    <button id="resetBtn" class="menu-item danger" type="button" role="menuitem">Start over</button>
    <input id="importInput" type="file" accept="application/json,.json" hidden />
    <p id="saveNote" class="save-note">Saved on this device · cloud sync coming soon</p>
  </div>

  <div id="scrim" class="scrim" hidden></div>

  <div id="adventure" class="adventure" role="dialog" aria-modal="true" aria-labelledby="advTitle" hidden>
    <div class="adv-backdrop" id="advBackdrop"></div>
    <div class="adv-card">
      <button id="advClose" class="icon-btn adv-close" type="button" aria-label="Close">✕</button>
      <h2 id="advTitle" class="adv-title">State</h2>
      <div class="adv-daterow">
        <label for="advDate">First visited</label>
        <input id="advDate" type="date" />
      </div>
      <div id="advPhotos" class="adv-photos"></div>
      <button id="advAddPhoto" class="adv-add" type="button">＋ Add photos from this trip</button>
      <input id="advPhotoInput" type="file" accept="image/*" multiple hidden />
      <label for="advNote" class="adv-note-label">A memory</label>
      <textarea id="advNote" class="adv-note" rows="2" placeholder="Add a note about this adventure…"></textarea>
      <button id="advRemove" class="adv-remove" type="button">Peel sticker off the map</button>
      <p class="adv-hint">Photos are saved on this device for now · your Google account later</p>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
